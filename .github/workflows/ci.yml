name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Check types, lint, build, and test in VS Code
        run: xvfb-run -a npm test
      - name: Package extension
        run: npm run vsix -- --out "diagram-${{ github.sha }}.vsix"
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          path: diagram-${{ github.sha }}.vsix
          if-no-files-found: error
          archive: false
          retention-days: 90
