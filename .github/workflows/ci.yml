name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}
      - name: Check types, lint, build, and package
        run: npm run vsix -- --out "diagram-chat-${{ github.sha }}.vsix"
      # Tests the minified bundles on a desktop-sized screen.
      - name: Test in VS Code
        run: npm run compile-tests && xvfb-run -a --server-args="-screen 0 1920x1080x24" npx vscode-test
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          path: diagram-chat-${{ github.sha }}.vsix
          if-no-files-found: error
          archive: false
          retention-days: 90

  publish:
    name: Publish to Visual Studio Marketplace
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Download tested VSIX
        uses: actions/download-artifact@v8
        with:
          name: diagram-chat-${{ github.sha }}.vsix
          skip-decompress: true
      - name: Sign in with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish tested VSIX
        run: npx --no-install vsce publish --azure-credential --packagePath "diagram-chat-${{ github.sha }}.vsix"

  publish-open-vsx:
    name: Publish to Open VSX
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Download tested VSIX
        uses: actions/download-artifact@v8
        with:
          name: diagram-chat-${{ github.sha }}.vsix
          skip-decompress: true
      - name: Publish tested VSIX
        run: npx --no-install ovsx publish --trusted-publishing --packagePath "diagram-chat-${{ github.sha }}.vsix"
