name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so keep the token from install scripts and tests.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The VS Code that the tests run in, downloaded again only when .vscode-test.mjs changes it.
      - uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}
      - name: Check types, lint, build, and package
        run: npm run vsix -- --out "diagram-${{ github.sha }}.vsix"
      # Against the minified bundles just packaged, as npm test would test unminified ones.
      - name: Test in VS Code
        run: npm run compile-tests && xvfb-run -a npx vscode-test
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          path: diagram-${{ github.sha }}.vsix
          if-no-files-found: error
          archive: false
          retention-days: 90
